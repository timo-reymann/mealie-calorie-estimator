# SonarQube Cloud automatic analysis configuration.
# This project has no CI-based Sonar analysis, so settings live here and not in
# a sonar-project.properties file.

# Keep tests out of issue analysis and out of copy-paste detection: the Quality
# Gate measures "Duplication on New Code" on them otherwise, and repetition
# between similar test cases is expected.
sonar.exclusions=tests/**/*
sonar.test.exclusions=tests/**/*
sonar.cpd.exclusions=tests/**/*
